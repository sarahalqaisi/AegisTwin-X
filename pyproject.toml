[project]
name = "aegistwin-x"
version = "0.1.0"
description = "AI-assisted product security intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "networkx>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["aegistwin"]
